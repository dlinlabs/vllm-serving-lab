name: Linux CPU acceptance (manual)

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-cpu-tests.txt
      - name: Install CPU test dependencies
        run: python -m pip install -r requirements-cpu-tests.txt
      - name: Run complete native CPU acceptance
        run: python scripts/run_linux_cpu_tests.py
      - name: Retain acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-cpu-${{ github.sha }}-${{ github.run_attempt }}
          path: cpu-ci-artifacts/
          if-no-files-found: error
          retention-days: 30
