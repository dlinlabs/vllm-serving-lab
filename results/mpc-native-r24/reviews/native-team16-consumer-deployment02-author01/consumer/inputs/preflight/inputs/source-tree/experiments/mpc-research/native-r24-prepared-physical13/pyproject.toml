[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr33-r23-queue-observer"
version = "0.5.0"
requires-python = ">=3.12"

[project.entry-points."vllm.general_plugins"]
pr33_r23_queue_observer = "queue_observer:register"
pr33_r23_input_post_observer = "input_post_observer:register"
pr33_r24_phase_observer = "phase_observer:register"
pr33_r24_host_trace = "host_trace_plugin:register"

[project.entry-points."vllm.endpoint_plugins"]
pr33_r23_queue_observer = "queue_observer:Endpoint"
pr33_r23_input_post_observer = "input_post_observer:Endpoint"
pr33_r24_phase_observer = "phase_observer:Endpoint"

[tool.setuptools]
py-modules = ["queue_observer", "input_post_observer", "phase_observer", "process_clock_provenance", "native_host_trace", "host_trace_plugin"]
